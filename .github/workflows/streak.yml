name: ⚡ Auto Streak Updater

on:
  schedule:
    # Runs daily at 10:00 UTC (approx. 1:00 PM Jordan Time / UTC+3)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Manual commit override count (leave 0 for random 2-6)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: streak-updater
  cancel-in-progress: false

jobs:
  keep_streak:
    name: 🚀 Keep Contribution Streak
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🎲 Execute Streak Generator Engine
        env:
          INPUT_COUNT: ${{ github.event.inputs.commit_count }}
          GIT_NAME: ${{ vars.GIT_USER_NAME || secrets.GIT_USER_NAME || 'Mahmoud Al-Esawi' }}
          GIT_EMAIL: ${{ vars.GIT_USER_EMAIL || secrets.GIT_USER_EMAIL || 'esawi@ieee.org' }}
        run: |
          chmod +x scripts/generate_commits.sh
          if [ -n "$INPUT_COUNT" ] && [ "$INPUT_COUNT" -gt 0 ]; then
            bash scripts/generate_commits.sh --count "$INPUT_COUNT"
          else
            bash scripts/generate_commits.sh
          fi
