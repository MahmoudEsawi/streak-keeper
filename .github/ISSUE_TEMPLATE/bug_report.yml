name: 🐛 Bug Report
description: File a report to help us fix a bug or issue with streak automation
title: "[BUG]: "
labels: ["🐛 bug", "🤖 automation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill in the details below.

  - type: input
    id: workflow_run_url
    attributes:
      label: GitHub Actions Run URL (if applicable)
      description: Provide the URL of the failing GitHub Actions run.
      placeholder: https://github.com/MahmoudEsawi/my-green-graph/actions/runs/...

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Fork the repo
        2. Set repository permissions to ...
        3. Trigger workflow via workflow_dispatch
        4. See error in step ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Error Output
      description: Paste any terminal logs or workflow error outputs here.
      render: shell
